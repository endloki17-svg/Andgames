<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#000000">
    <title>NexBlock | 플레이 모드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" /><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script><link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark play-mode">
    <div id="loading-screen" class="loading-overlay active"><div class="loader-content"><div class="spinner"></div><h2 class="glow-text">서버에 접속하는 중...</h2><p class="loading-tip">Tip: WASD 키나 조이스틱을 사용해 이동할 수 있습니다.</p></div></div>
    <div id="toast-container" class="toast-container"></div><canvas id="play-canvas" class="infinite-canvas"></canvas>
    <div class="hud-layer pointer-events-none"><header class="play-header glass-panel fade-in-down pointer-events-auto"><div class="header-left"><button class="icon-btn-text btn-danger-ghost tooltip" data-tooltip="로비로 나가기" onclick="exitGame()"><span class="material-symbols-outlined">logout</span><span class="hidden-mobile">나가기</span></button></div><div class="header-center"><div class="play-title-box"><h2 id="play-game-title" class="game-title-glow">알 수 없는 월드</h2><div class="server-status"><span class="status-dot online"></span><span id="player-count">1명 플레이 중</span></div></div></div><div class="header-right"><button id="buy-pass-btn" class="btn btn-vip pulse-anim" onclick="buyPass()"><span class="material-symbols-outlined">stars</span><span class="btn-text">VIP 패스</span></button></div></header>
        <div class="chat-widget glass-panel fade-in-left pointer-events-auto"><div class="chat-header"><span class="material-symbols-outlined" style="font-size: 18px;">forum</span><span>실시간 채팅</span><button class="icon-btn-small" onclick="toggleChat()" style="margin-left: auto;"><span class="material-symbols-outlined" id="chat-toggle-icon">expand_more</span></button></div><div class="chat-body" id="chat-body-container"><div class="chat-messages" id="chat-box"><div class="chat-msg system-msg"><span class="material-symbols-outlined">info</span>채팅 서버에 연결 중입니다...</div></div><div class="chat-input-area"><input type="text" id="chat-input" placeholder="메시지를 입력하세요..." autocomplete="off"><button class="icon-btn-send" onclick="sendChat()"><span class="material-symbols-outlined">send</span></button></div></div></div>
        <div class="mobile-controls fade-in-up pointer-events-auto"><div class="joystick-container" id="play-joystick"><div class="joystick-knob" id="play-knob"></div></div><div class="action-btn-container"><button class="action-btn" id="jump-btn"><span class="material-symbols-outlined" style="font-size: 40px;">keyboard_double_arrow_up</span></button></div></div>
    </div>
    <script src="script.js"></script><script src="fixes.js"></script><script>window.addEventListener('DOMContentLoaded', () => { const gameIndex = new URLSearchParams(window.location.search).get('id'); if (typeof initPlayMode === 'function') initPlayMode(gameIndex); });</script>
</body>
</html>
