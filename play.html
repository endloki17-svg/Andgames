<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 게임처럼 화면을 고정하고 핀치 줌을 완벽히 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    
    <title>NexBlock | 플레이 모드</title>

    <!-- 최고급 웹 폰트 & 아이콘 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

    <!-- PeerJS for Online Multiplayer (플레이 화면에 필수) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- 공통 및 게임 전용 스타일시트 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark play-mode">

    <!-- ⏳ 1. 접속 로딩 스크린 (초고퀄리티 연출) -->
    <div id="loading-screen" class="loading-overlay active">
        <div class="loader-content">
            <div class="spinner"></div>
            <h2 class="glow-text">서버에 접속하는 중...</h2>
            <p class="loading-tip">Tip: WASD 키나 조이스틱을 사용해 이동할 수 있습니다.</p>
        </div>
    </div>

    <!-- 🔔 2. 전역 알림 시스템 -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 🎮 3. 물리 엔진 & 렌더링 캔버스 (가장 밑바닥 레이어) -->
    <canvas id="play-canvas" class="infinite-canvas"></canvas>

    <!-- 🖥️ 4. 게임 HUD (Head-Up Display) 레이어 -->
    <!-- pointer-events-none을 통해 빈 공간 클릭 시 캔버스로 이벤트가 통과하도록 설정 -->
    <div class="hud-layer pointer-events-none">
        
        <!-- 상단 정보 바 (글래스모피즘) -->
        <header class="play-header glass-panel fade-in-down pointer-events-auto">
            <div class="header-left">
                <button class="icon-btn-text btn-danger-ghost tooltip" data-tooltip="로비로 나가기" onclick="exitGame()">
                    <span class="material-symbols-outlined">logout</span>
                    <span class="hidden-mobile">나가기</span>
                </button>
            </div>
            
            <div class="header-center">
                <div class="play-title-box">
                    <h2 id="play-game-title" class="game-title-glow">알 수 없는 월드</h2>
                    <div class="server-status">
                        <span class="status-dot online"></span>
                        <span id="player-count">1명 플레이 중</span>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <!-- 패스 구매 버튼 (VIP 기능) -->
                <button id="buy-pass-btn" class="btn btn-vip pulse-anim" onclick="buyPass()">
                    <span class="material-symbols-outlined">stars</span>
                    <span class="btn-text">VIP 패스</span>
                </button>
            </div>
        </header>

        <!-- 💬 실시간 멀티플레이 채팅 위젯 -->
        <div class="chat-widget glass-panel fade-in-left pointer-events-auto">
            <div class="chat-header">
                <span class="material-symbols-outlined" style="font-size: 18px;">forum</span>
                <span>실시간 채팅</span>
                <button class="icon-btn-small" onclick="toggleChat()" style="margin-left: auto;">
                    <span class="material-symbols-outlined" id="chat-toggle-icon">expand_more</span>
                </button>
            </div>
            
            <div class="chat-body" id="chat-body-container">
                <!-- 채팅 메시지들이 쌓이는 공간 -->
                <div class="chat-messages" id="chat-box">
                    <div class="chat-msg system-msg">
                        <span class="material-symbols-outlined">info</span>
                        채팅 서버에 연결 중입니다...
                    </div>
                </div>
                
                <!-- 채팅 입력 폼 -->
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                    <button class="icon-btn-send" onclick="sendChat()">
                        <span class="material-symbols-outlined">send</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 🕹️ 모바일 & 터치 컨트롤러 -->
        <div class="mobile-controls fade-in-up pointer-events-auto">
            <!-- 좌측 하단 이동 조이스틱 -->
            <div class="joystick-container" id="play-joystick">
                <div class="joystick-knob" id="play-knob"></div>
            </div>
            
            <!-- 우측 하단 점프 액션 버튼 -->
            <div class="action-btn-container">
                <button class="action-btn" id="jump-btn">
                    <span class="material-symbols-outlined" style="font-size: 40px;">keyboard_double_arrow_up</span>
                </button>
                <!-- 추가 기능을 위한 예비 버튼 (공격, 상호작용 등) -->
                <button class="action-btn small-action" id="interact-btn" style="display: none;">
                    <span class="material-symbols-outlined">front_hand</span>
                </button>
            </div>
        </div>

    </div>

    <!-- 자바스크립트 연결 -->
    <script src="script.js"></script>
    <script>
        // 페이지 로드 시 인게임 전용 초기화 트리거 (임시 코드, 실제 로직은 script.js에 통합)
        window.addEventListener('DOMContentLoaded', () => {
            // URL 파라미터에서 게임 ID를 읽어오는 로직 준비
            const urlParams = new URLSearchParams(window.location.search);
            const gameIndex = urlParams.get('id');
            
            if (typeof initPlayMode === 'function') {
                initPlayMode(gameIndex);
            }
        });
    </script>
</body>
</html>
