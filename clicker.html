<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <title>NexBlock | 차원 채굴기 (AND 벌기)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark clicker-mode" id="clicker-body">
    <canvas id="clicker-bg-canvas" class="background-canvas"></canvas>
    <canvas id="clicker-fx-canvas" class="particle-canvas"></canvas>
    <div class="clicker-ui-layer">
        <header class="clicker-header glass-panel fade-in-down">
            <button class="icon-btn-text" onclick="location.href='index.html'"><span class="material-symbols-outlined">arrow_back</span><span>메인 로비</span></button>
            <div class="header-title"><span class="material-symbols-outlined" style="color: #00ffcc; text-shadow: 0 0 10px #00ffcc;">auto_awesome</span><h2>차원 에너지 채굴장</h2></div>
            <div class="currency-display massive-display"><span class="material-symbols-outlined icon-gold">monetization_on</span><span id="clicker-balance" class="currency-amount number-pop">0</span><span class="currency-label">AND</span></div>
        </header>
        <main class="clicker-main-area">
            <div id="combo-display" class="combo-container fade-out"><span class="combo-text">COMBO!</span><span id="combo-count" class="combo-number">x1</span></div>
            <div class="target-wrapper" id="click-target-wrapper"><div class="target-object" id="main-clicker-target" onmousedown="triggerClick(event)" ontouchstart="triggerClick(event)"><div class="target-core"><span class="core-icon">💰</span></div><div class="target-aura"></div></div></div>
            <div class="clicker-stats glass-panel fade-in-up"><div class="stat-item"><span class="stat-label">클릭당 수익</span><span class="stat-value text-gradient">+1 AND</span></div><div class="divider-vertical"></div><div class="stat-item"><span class="stat-label">채굴 효율</span><span class="stat-value" style="color: #00ffcc;">100%</span></div></div>
        </main>
    </div>
    <script src="script.js"></script>
    <script src="fixes.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => { if (typeof initClickerMode === 'function') initClickerMode(); });
        document.addEventListener('dblclick', event => event.preventDefault(), { passive: false });
    </script>
</body>
</html>
