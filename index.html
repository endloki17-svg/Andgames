<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON MAFIA - 하이퍼 무브먼트 마피아</title>
    
    <!-- 필수 라이브러리 (PeerJS, NippleJS) -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    
    <!-- 고퀄리티 웹 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

    <style>
        :root {
            --bg-color: #05050a;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-yellow: #ffcc00;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas { display: block; width: 100vw; height: 100vh; }

        /* 글래스모피즘 메인 메뉴 UI */
        #menu-ui {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15);
            padding: 40px; border-radius: 24px;
            text-align: center; min-width: 300px; z-index: 100;
            transition: opacity 0.5s;
        }

        h1 {
            margin-top: 0; font-size: 32px; font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
            letter-spacing: 2px;
        }

        .info-text { color: #aaa; margin-bottom: 25px; font-size: 14px; }
        .my-id-box { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; margin-bottom: 20px; font-family: monospace; color: var(--neon-yellow); }

        input {
            width: 100%; padding: 15px; margin-bottom: 15px;
            border-radius: 12px; border: 1px solid var(--neon-cyan);
            background: rgba(0,0,0,0.6); color: #fff; font-size: 16px;
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }

        .btn {
            width: 100%; padding: 16px; border-radius: 12px;
            border: none; font-weight: 800; font-size: 16px;
            cursor: pointer; transition: 0.2s; margin-bottom: 10px;
        }
        .btn-host { background: var(--neon-cyan); color: #000; }
        .btn-host:hover { box-shadow: 0 0 20px var(--neon-cyan); transform: scale(1.02); }
        .btn-join { background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan); }
        .btn-join:hover { background: rgba(0,243,255,0.1); transform: scale(1.02); }

        /* 인게임 UI */
        #game-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50; display: none;
        }

        .top-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .role-badge {
            background: rgba(0,0,0,0.6); border: 2px solid #fff;
            padding: 10px 25px; border-radius: 30px; font-size: 18px; font-weight: 800;
            backdrop-filter: blur(5px);
        }
        .role-mafia { border-color: var(--neon-pink); color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
        .role-citizen { border-color: var(--neon-cyan); color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }

        .event-text {
            font-size: 24px; font-weight: 900; color: var(--neon-yellow);
            text-shadow: 0 0 20px var(--neon-yellow);
        }

        /* 모바일 컨트롤 UI */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; pointer-events: auto; }
        #action-zone { position: absolute; bottom: 40px; right: 40px; display: flex; gap: 20px; pointer-events: auto; }
        
        .action-btn {
            width: 75px; height: 75px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
            color: #fff; font-weight: 900; font-size: 14px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            user-select: none; transition: 0.1s;
        }
        .action-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.3); }
        .btn-danger { border-color: var(--neon-pink); background: rgba(255,0,85,0.1); color: var(--neon-pink); }
        .btn-danger:active { background: rgba(255,0,85,0.4); }
    </style>
</head>
<body>

    <!-- 메인 메뉴 -->
    <div id="menu-ui">
        <h1>NEON MAFIA</h1>
        <p class="info-text">초고퀄 이동형 마피아 게임</p>
        <div class="my-id-box">내 ID: <span id="my-id">생성 중...</span></div>
        <button class="btn btn-host" id="btn-host">방 만들기 (호스트)</button>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 25px 0;">
        <input type="text" id="join-id" placeholder="호스트의 ID를 입력하세요">
        <button class="btn btn-join" id="btn-join">참가하기</button>
    </div>

    <!-- 인게임 화면 -->
    <div id="game-ui">
        <div class="top-bar">
            <div id="role-display" class="role-badge role-citizen">역할: 시민</div>
            <div id="event-display" class="event-text">대기 중...</div>
        </div>
        
        <!-- 모바일 컨트롤 영역 -->
        <div id="joystick-zone"></div>
        <div id="action-zone">
            <div class="action-btn btn-danger" id="btn-kill" style="display:none;">KILL</div>
            <div class="action-btn" id="btn-jump">JUMP</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/** 
 * 1. 기본 설정 및 캔버스 스케일링 
 * (해상도가 달라도 동일한 물리 공간(1920x1080)을 공유하도록 설정)
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GAME_W = 1920, GAME_H = 1080;
const FLOOR_Y = 950;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/** 
 * 2. 네트워크 및 게임 상태 초기화 
 */
const peer = new Peer();
let myId = null;
let isHost = false;
let hostConn = null;
let clients = {}; // 호스트 전용: 연결된 클라이언트들

peer.on('open', id => {
    myId = id;
    document.getElementById('my-id').innerText = id;
});

// 호스트가 관리하는 메인 게임 상태
let gameState = {
    players: {}, 
    event: '평화로운 밤',
    particles: [] 
};

// 클라이언트의 로컬 입력 상태
let inputState = { dx: 0, jump: false, action: false };
let myRole = '대기중';

// 이벤트 프리셋
const EVENTS = [
    { name: '평화로운 밤', gravity: 0.8, speed: 8, dark: false },
    { name: '⚠️ 블랙아웃 (시야 제한)', gravity: 0.8, speed: 6, dark: true },
    { name: '🌌 저중력 지대', gravity: 0.3, speed: 8, dark: false },
    { name: '⚡ 스피드 부스트', gravity: 0.8, speed: 15, dark: false }
];
let currentEvent = EVENTS[0];

/** 
 * 3. 호스트 (방장) 로직 
 */
document.getElementById('btn-host').addEventListener('click', () => {
    isHost = true;
    startGameUI();
    addPlayer(myId);
    
    peer.on('connection', conn => {
        clients[conn.peer] = conn;
        addPlayer(conn.peer);
        
        // 클라이언트로부터 입력 받기
        conn.on('data', payload => {
            if(payload.type === 'input') {
                let p = gameState.players[conn.peer];
                if(p && p.alive) {
                    p.dx = payload.data.dx;
                    if(payload.data.jump && p.grounded) { p.vy = -20; p.grounded = false; }
                    if(payload.data.action) handleKill(conn.peer);
                }
            }
        });
        
        conn.on('close', () => { delete gameState.players[conn.peer]; delete clients[conn.peer]; });
    });
    
    // 10초 후 역할 배정 (테스트를 위해 짧게 설정)
    setTimeout(assignRoles, 10000);
    // 15초마다 랜덤 이벤트 발생
    setInterval(triggerRandomEvent, 15000);
    // 60FPS 물리 엔진 루프
    setInterval(hostPhysicsLoop, 1000/60);
});

/** 
 * 4. 클라이언트 (참가자) 로직 
 */
document.getElementById('btn-join').addEventListener('click', () => {
    const hid = document.getElementById('join-id').value;
    if(!hid) return alert('호스트 ID를 입력하세요.');
    
    hostConn = peer.connect(hid);
    hostConn.on('open', () => {
        startGameUI();
        // 호스트로부터 상태 받기
        hostConn.on('data', payload => {
            if(payload.type === 'state') gameState = payload.state;
            if(payload.type === 'role') updateMyRole(payload.role);
        });
    });
});

/** 
 * 5. 게임 핵심 함수 (역할, 킬, 물리)
 */
function addPlayer(id) {
    gameState.players[id] = {
        x: Math.random() * (GAME_W - 200) + 100,
        y: 200, vx: 0, vy: 0, dx: 0,
        color: `hsl(${Math.random()*360}, 100%, 60%)`,
        role: '시민', alive: true, grounded: false, lastKill: 0
    };
}

function assignRoles() {
    const ids = Object.keys(gameState.players);
    if(ids.length < 2) {
        gameState.event = "인원이 부족하여 마피아 배정 대기중...";
        return;
    }
    const mafiaId = ids[Math.floor(Math.random() * ids.length)];
    ids.forEach(id => {
        const role = (id === mafiaId) ? '마피아' : '시민';
        gameState.players[id].role = role;
        if(id === myId) updateMyRole(role);
        else clients[id].send({ type: 'role', role: role });
    });
    triggerRandomEvent();
}

function updateMyRole(role) {
    myRole = role;
    const rd = document.getElementById('role-display');
    rd.innerText = `역할: ${role}`;
    rd.className = role === '마피아' ? 'role-badge role-mafia' : 'role-badge role-citizen';
    if(role === '마피아') document.getElementById('btn-kill').style.display = 'flex';
}

function handleKill(attackerId) {
    const p = gameState.players[attackerId];
    if(p.role !== '마피아' || !p.alive) return;
    
    const now = Date.now();
    if(now - p.lastKill < 5000) return; // 5초 쿨다운
    
    for(let tid in gameState.players) {
        if(tid === attackerId) continue;
        const target = gameState.players[tid];
        if(!target.alive) continue;
        
        const dist = Math.hypot(target.x - p.x, target.y - p.y);
        if(dist < 180) { // 킬 사거리
            target.alive = false;
            p.lastKill = now;
            createExplosion(target.x, target.y, target.color);
            break;
        }
    }
}

function createExplosion(x, y, color) {
    for(let i=0; i<20; i++) {
        gameState.particles.push({
            x, y, 
            vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
            life: 1.0, color
        });
    }
}

function triggerRandomEvent() {
    currentEvent = EVENTS[Math.floor(Math.random() * EVENTS.length)];
    gameState.event = currentEvent.name;
}

// [호스트 전용] 물리 엔진 및 상태 브로드캐스트
function hostPhysicsLoop() {
    for(let id in gameState.players) {
        let p = gameState.players[id];
        if(!p.alive) continue;
        
        p.x += p.dx * currentEvent.speed;
        p.vy += currentEvent.gravity;
        p.y += p.vy;
        
        // 바닥 충돌
        if(p.y > FLOOR_Y) { p.y = FLOOR_Y; p.vy = 0; p.grounded = true; }
        // 벽 충돌
        if(p.x < 50) p.x = 50;
        if(p.x > GAME_W - 50) p.x = GAME_W - 50;
    }
    
    // 파티클 업데이트
    for(let i = gameState.particles.length-1; i>=0; i--) {
        let pt = gameState.particles[i];
        pt.x += pt.vx; pt.y += pt.vy;
        pt.life -= 0.03;
        if(pt.life <= 0) gameState.particles.splice(i, 1);
    }
    
    // 모든 클라이언트에게 상태 전송
    const payload = { type: 'state', state: gameState };
    for(let id in clients) clients[id].send(payload);
}

/** 
 * 6. 조작 및 UI 전환 (PC + Mobile 완벽 지원)
 */
function startGameUI() {
    document.getElementById('menu-ui').style.opacity = '0';
    setTimeout(() => document.getElementById('menu-ui').style.display = 'none', 500);
    document.getElementById('game-ui').style.display = 'block';
    
    initControls();
    requestAnimationFrame(renderLoop); // 렌더링 시작
}

function initControls() {
    // 1. NippleJS (모바일 조이스틱)
    const joystick = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static', position: { left: '50%', top: '50%' }, color: '#00f3ff'
    });
    joystick.on('move', (e, data) => { inputState.dx = Math.cos(data.angle.radian); });
    joystick.on('end', () => { inputState.dx = 0; });
    
    // 2. 키보드 (PC)
    window.addEventListener('keydown', e => {
        if(e.key === 'a' || e.key === 'ArrowLeft') inputState.dx = -1;
        if(e.key === 'd' || e.key === 'ArrowRight') inputState.dx = 1;
        if(e.key === 'w' || e.key === ' ' || e.key === 'ArrowUp') inputState.jump = true;
        if(e.key === 'q' || e.key === 'Enter') inputState.action = true;
    });
    window.addEventListener('keyup', e => {
        if(['a','d','ArrowLeft','ArrowRight'].includes(e.key)) inputState.dx = 0;
    });
    
    // 3. 터치 버튼 (점프/킬)
    const bindBtn = (id, field) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', e => { e.preventDefault(); inputState[field] = true; });
        btn.addEventListener('mousedown', e => { e.preventDefault(); inputState[field] = true; });
    };
    bindBtn('btn-jump', 'jump');
    bindBtn('btn-kill', 'action');
    
    // 60FPS로 호스트에게 입력 전송
    setInterval(() => {
        if(isHost) {
            let p = gameState.players[myId];
            if(p && p.alive) {
                p.dx = inputState.dx;
                if(inputState.jump && p.grounded) { p.vy = -20 * (currentEvent.name.includes('저중력') ? 1.5 : 1); p.grounded = false; }
                if(inputState.action) handleKill(myId);
            }
        } else if (hostConn) {
            hostConn.send({ type: 'input', data: inputState });
        }
        // 트리거 초기화
        inputState.jump = false; 
        inputState.action = false;
    }, 1000/60);
}

/** 
 * 7. 렌더링 (그래픽) 
 */
function renderLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    
    // 화면 크기에 맞게 스케일링 (카메라 뷰)
    const scale = Math.min(canvas.width / GAME_W, canvas.height / GAME_H);
    const offsetX = (canvas.width - GAME_W * scale) / 2;
    const offsetY = (canvas.height - GAME_H * scale) / 2;
    
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);
    
    document.getElementById('event-display').innerText = gameState.event;
    
    // 배경 및 바닥 그리기
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    
    ctx.fillStyle = '#112';
    ctx.fillRect(0, FLOOR_Y, GAME_W, GAME_H - FLOOR_Y);
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, FLOOR_Y); ctx.lineTo(GAME_W, FLOOR_Y); ctx.stroke();

    // 파티클 그리기
    gameState.particles.forEach(pt => {
        ctx.globalAlpha = pt.life;
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 8, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // 플레이어 그리기
    for(let id in gameState.players) {
        let p = gameState.players[id];
        
        if(!p.alive) {
            // 시체 그리기 (묘비 또는 쓰러진 네온)
            ctx.fillStyle = 'rgba(255,0,85,0.5)';
            ctx.fillRect(p.x - 30, FLOOR_Y - 15, 60, 15);
            continue;
        }
        
        // 네온 글로우 효과
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 20;
        ctx.fillStyle = p.color;
        
        // 캐릭터 본체 (원형)
        ctx.beginPath();
        ctx.arc(p.x, p.y - 40, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // 이름 / 태그
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 20px Pretendard';
        ctx.fillText(id === myId ? '나' : 'USER', p.x, p.y - 95);
        
        // 마피아 시야 공유 (마피아끼리는 서로 붉게 보임)
        if(myRole === '마피아' && p.role === '마피아') {
             ctx.fillStyle = '#ff0055';
             ctx.fillText('마피아', p.x, p.y - 120);
        }
    }
    
    // 블랙아웃 (시야 제한) 이벤트 렌더링
    const isDark = gameState.event.includes('블랙아웃');
    if(isDark && gameState.players[myId] && gameState.players[myId].alive) {
        let myP = gameState.players[myId];
        let grad = ctx.createRadialGradient(myP.x, myP.y - 40, 100, myP.x, myP.y - 40, 500);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.98)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, GAME_W, GAME_H);
    }
    
    ctx.restore();
    requestAnimationFrame(renderLoop);
}
</script>
</body>
</html>
