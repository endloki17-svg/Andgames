<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CreateVerse - 궁극의 샌드박스 메이커</title>
    
    <!-- 초고퀄리티 UI를 위한 프리텐다드 폰트 적용 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <!-- 직관적인 UI를 위한 폰트어썸 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ⚠️ 바로 이 파일(style.css)이 있어야 완벽한 디자인이 나옵니다 ⚠️ -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 멀티플레이를 위한 PeerJS 라이브러리 -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <!-- 앱 전체를 감싸는 메인 컨테이너 -->
    <div id="app-container">
        
        <!-- 1. 로딩 스크린 (초반 진입 시 고급스러움 강조) -->
        <div id="loading-screen" class="screen active">
            <div class="loader-content">
                <i class="fa-solid fa-cube fa-spin logo-icon"></i>
                <h1>CreateVerse</h1>
                <p>무한한 세계를 불러오는 중...</p>
                <div class="progress-bar"><div class="progress-fill"></div></div>
            </div>
        </div>

        <!-- 2. 메인 로비 (게임 목록 및 내 정보) -->
        <div id="main-menu" class="screen hidden">
            <!-- 상단 네비게이션 바 -->
            <header class="top-nav glass-nav">
                <div class="brand">
                    <i class="fa-solid fa-cube text-primary"></i> 
                    <span>CreateVerse</span>
                </div>
                <div class="user-dashboard">
                    <div class="currency-badge pop">
                        <i class="fa-solid fa-coins text-gold"></i>
                        <span id="and-balance" class="balance-text">0</span>
                        <span class="currency-unit">and</span>
                    </div>
                    <button class="btn btn-primary pop" onclick="UI.showPublishModal()">
                        <i class="fa-solid fa-plus"></i> <span>새 게임 만들기</span>
                    </button>
                </div>
            </header>
            
            <!-- 게임 리스트 영역 (스크롤 가능) -->
            <main class="content-area scrollable">
                <div class="header-banner">
                    <h2>지금 뜨고 있는 세계들</h2>
                    <p>다른 유저가 만든 맵을 탐험하거나, 나만의 규칙을 만들어보세요.</p>
                </div>
                <div id="game-list" class="game-grid">
                    <!-- 자바스크립트를 통해 게임 카드들이 여기에 생성됩니다 -->
                </div>
            </main>
        </div>

        <!-- 3. 새 게임 만들기 (모달 팝업) -->
        <div id="publish-modal" class="modal-backdrop hidden">
            <div class="modal-window">
                <div class="modal-header">
                    <h2><i class="fa-solid fa-rocket"></i> 새로운 세계 창조</h2>
                    <button class="icon-btn" onclick="UI.hidePublishModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label>게임 이름</label>
                        <input type="text" id="game-name" placeholder="예: 무한 클릭커 키우기" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label>게임 설명</label>
                        <textarea id="game-desc" placeholder="플레이어들에게 이 게임의 규칙을 설명해주세요" rows="3"></textarea>
                    </div>
                    <div class="input-row">
                        <div class="input-group half">
                            <label>대표 아이콘</label>
                            <input type="text" id="game-icon" value="🎮" maxlength="2" class="center-text">
                        </div>
                        <div class="input-group half">
                            <label>입장 패스 (and)</label>
                            <div class="price-input">
                                <i class="fa-solid fa-coins text-gold"></i>
                                <input type="number" id="game-pass-price" value="0" min="0">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" onclick="UI.hidePublishModal()">취소</button>
                    <button class="btn btn-primary pop" onclick="GameApp.createNewGame()">
                        <i class="fa-solid fa-hammer"></i> 에디터 열기
                    </button>
                </div>
            </div>
        </div>

        <!-- 4. 게임 엔진 화면 (실제 플레이 및 편집 캔버스) -->
        <div id="game-screen" class="screen hidden">
            <!-- 렌더링 캔버스 -->
            <canvas id="game-canvas"></canvas>
            
            <!-- (A) 편집 모드 전용 UI -->
            <div id="editor-ui" class="game-ui-layer hidden">
                <div class="editor-toolbar glass-panel slide-down">
                    <button class="tool-btn active pop" id="tool-draw" onclick="Editor.setTool('draw')" title="블록 생성">
                        <i class="fa-solid fa-cube"></i><span>블록</span>
                    </button>
                    <button class="tool-btn pop" id="tool-erase" onclick="Editor.setTool('erase')" title="블록 지우기">
                        <i class="fa-solid fa-eraser"></i><span>지우개</span>
                    </button>
                    <div class="toolbar-divider"></div>
                    <button class="tool-btn special pop" id="tool-clicker" onclick="Editor.setTool('clicker')" title="화폐 박스">
                        <i class="fa-solid fa-sack-dollar"></i><span>and 화폐함</span>
                    </button>
                    
                    <div class="toolbar-spacer"></div>
                    
                    <div class="camera-hint">
                        <i class="fa-solid fa-arrows-up-down-left-right"></i> WASD 무한 이동
                    </div>
                    <button class="btn btn-success pop" onclick="GameApp.saveAndExit()">
                        <i class="fa-solid fa-floppy-disk"></i> 저장 및 나가기
                    </button>
                </div>
            </div>

            <!-- (B) 플레이 모드 전용 UI -->
            <div id="play-ui" class="game-ui-layer hidden">
                <!-- 뒤로가기 버튼 -->
                <button class="btn-back glass-panel pop" onclick="GameApp.exitPlay()">
                    <i class="fa-solid fa-chevron-left"></i> 나가기
                </button>
                
                <!-- 멀티플레이 실시간 채팅창 -->
                <div id="chat-widget" class="chat-panel glass-panel">
                    <div id="chat-messages" class="scrollable">
                        <!-- 채팅 내용 추가됨 -->
                    </div>
                    <div class="chat-input-box">
                        <input type="text" id="chat-input" placeholder="채팅 입력..." autocomplete="off">
                        <button class="chat-send-btn pop" onclick="Network.sendChat()">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <!-- 모바일 터치 컨트롤 (조이스틱 & 점프) -->
                <div class="mobile-controls-layer">
                    <div class="joystick-base" id="joystick">
                        <div class="joystick-stick" id="knob"></div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-jump pop" id="jump-btn">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 동적 파티클 효과 (코인 획득 시 텍스트 등) 컨테이너 -->
            <div id="particle-container"></div>
        </div>
        
        <!-- 토스트 알림창 -->
        <div id="toast-container"></div>
        
    </div>

    <!-- 핵심 로직 파일 (현재는 아직 생성 전) -->
    <script src="script.js"></script>
</body>
</html>
