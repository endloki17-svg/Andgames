<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebBlox - Ultimate Game Platform</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C5CE7;
            --secondary: #00CEC9;
            --dark: #0F172A;
            --darker: #020617;
            --panel: rgba(30, 41, 59, 0.7);
            --text: #F8FAFC;
            --gold: #FBBF24;
            --grid-size: 40px; /* 블록 하나 크기 */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        /* 스크롤 허용으로 변경 */
        body { font-family: 'Poppins', 'Noto Sans KR', sans-serif; background-color: var(--darker); color: var(--text); overflow-x: hidden; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px var(--primary); } 50% { box-shadow: 0 0 30px var(--secondary); } 100% { box-shadow: 0 0 10px var(--primary); } }

        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 24px; font-weight: 900; background: linear-gradient(45deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-info { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .currency { font-size: 16px; font-weight: bold; color: var(--gold); background: rgba(251, 191, 36, 0.1); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--gold); }
        .btn { padding: 10px 15px; border-radius: 12px; border: none; background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; font-weight: bold; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .btn:active { transform: scale(0.95); }
        
        /* Screens */
        .screen { display: none; padding: 20px; animation: fadeIn 0.4s ease-out; min-height: calc(100vh - 70px); }
        .screen.active { display: block; }

        /* Hub */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .game-card { background: var(--panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; cursor: pointer; transition: 0.3s; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--secondary); }

        /* Studio & Player Canvas */
        .studio-layout { display: flex; gap: 20px; flex-wrap: wrap; }
        .toolbar { width: 100%; max-width: 250px; background: var(--panel); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .tool-btn { padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 2px solid transparent; color: white; cursor: pointer; font-weight: bold; text-align: left;}
        .tool-btn.active { border-color: var(--secondary); background: rgba(0, 206, 201, 0.2); }
        
        /* 거대한 맵을 담을 스크롤 컨테이너 */
        .canvas-container { flex: 1; min-width: 300px; height: 60vh; background: #000; border-radius: 20px; overflow: auto; border: 2px solid rgba(255,255,255,0.1); position: relative; }
        .grid-wrapper { display: grid; grid-template-columns: repeat(30, var(--grid-size)); grid-template-rows: repeat(30, var(--grid-size)); width: max-content; }
        .grid-cell { width: var(--grid-size); height: var(--grid-size); border: 1px solid rgba(255,255,255,0.05); box-sizing: border-box; }
        
        /* Game Objects */
        .obj-wall { background: linear-gradient(45deg, #475569, #334155); }
        .obj-player { background: var(--secondary); border-radius: 50%; box-shadow: 0 0 10px var(--secondary); }
        .obj-lava { background: #EF4444; }
        .obj-goal { background: #10B981; border-radius: 50%; box-shadow: 0 0 15px #10B981; }

        /* Mobile Controls (D-pad) */
        #mobile-controls { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 500; flex-direction: column; align-items: center; gap: 5px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 50px; backdrop-filter: blur(5px); }
        .dpad-row { display: flex; gap: 5px; }
        .dpad-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border: none; border-radius: 15px; color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .dpad-btn:active { background: var(--primary); }

        /* Chat Widget */
        #chat-widget { position: fixed; bottom: 20px; right: 20px; width: 300px; height: 400px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; display: flex; flex-direction: column; z-index: 1000; transition: transform 0.3s; }
        #chat-widget.minimized { transform: translateY(345px); }
        .chat-header { padding: 10px 15px; background: var(--primary); border-radius: 15px 15px 0 0; display: flex; justify-content: space-between; cursor: pointer; font-weight: bold; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
        .chat-input { display: flex; padding: 10px; gap: 5px; }
        .chat-input input { flex: 1; background: #000; border: 1px solid #333; color: white; padding: 8px; border-radius: 10px; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal { background: var(--dark); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 10px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">WebBlox 2.0</div>
        <div class="nav-info">
            <div class="currency">🪙 <span id="andDisplay">0</span> And</div>
            <button class="btn" onclick="nav('hub')">홈화면</button>
            <button class="btn" onclick="openStudio()">🛠️ 게임 만들기</button>
        </div>
    </nav>

    <div id="app">
        <!-- 1. Hub Screen -->
        <div id="hub" class="screen active">
            <h2>플레이할 게임을 선택하세요</h2>
            <div class="game-grid" id="gameGrid"></div>
        </div>

        <!-- 2. Game Studio -->
        <div id="studio" class="screen">
            <div class="studio-layout">
                <div class="toolbar">
                    <h3 style="color: var(--secondary);">스튜디오 툴</h3>
                    <button class="tool-btn active" onclick="setTool('player')">🧍 시작점</button>
                    <button class="tool-btn" onclick="setTool('wall')">🧱 벽</button>
                    <button class="tool-btn" onclick="setTool('lava')">🔥 용암</button>
                    <button class="tool-btn" onclick="setTool('goal')">🏁 목표</button>
                    <button class="tool-btn" onclick="setTool('erase')" style="color: #F87171;">🧽 지우개</button>
                    <div style="flex:1; min-height: 20px;"></div>
                    <button class="btn" onclick="showPublishModal()">🚀 게임 게시하기</button>
                </div>
                <div class="canvas-container" id="editorScroll">
                    <div class="grid-wrapper" id="editorCanvas"></div>
                </div>
            </div>
            <p style="margin-top:10px; color:#94A3B8; font-size:12px;">마우스를 드래그하여 블록을 연속으로 설치할 수 있습니다.</p>
        </div>

        <!-- 3. Player Screen -->
        <div id="player" class="screen">
            <button class="btn" onclick="nav('hub')" style="margin-bottom: 15px;">← 나가기</button>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h2 id="playTitle">게임 제목</h2>
                <button class="btn" id="buyPassBtn" style="background: linear-gradient(45deg, #F59E0B, #EF4444);">💎 VIP 패스 구매</button>
            </div>
            <p id="playDesc" style="color: #94A3B8; margin-bottom: 15px;"></p>
            <div class="canvas-container" id="playScroll">
                <div class="grid-wrapper" id="playCanvas"></div>
            </div>
        </div>
    </div>

    <!-- Mobile D-PAD -->
    <div id="mobile-controls">
        <button class="dpad-btn" onclick="movePlayer(0, -1)">▲</button>
        <div class="dpad-row">
            <button class="dpad-btn" onclick="movePlayer(-1, 0)">◀</button>
            <button class="dpad-btn" onclick="movePlayer(0, 1)">▼</button>
            <button class="dpad-btn" onclick="movePlayer(1, 0)">▶</button>
        </div>
    </div>

    <!-- Multiplayer Chat Widget -->
    <div id="chat-widget" class="minimized">
        <div class="chat-header" onclick="toggleChat()">
            <span>🌐 멀티 채팅</span>
            <span id="chatToggleIcon">▲</span>
        </div>
        <div style="padding: 10px; font-size: 11px; text-align: center;">
            <button onclick="copyInviteLink()" class="btn" style="width:100%; padding: 8px;">🔗 내 방으로 친구 초대 링크 복사</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div style="color: #94A3B8;">서버 연결 중...</div>
        </div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="메시지..." onkeypress="if(event.key === 'Enter') sendMsg()">
            <button class="btn" onclick="sendMsg()" style="padding: 5px 10px;">전송</button>
        </div>
    </div>

    <!-- Publish Modal -->
    <div class="modal-overlay" id="publishModal">
        <div class="modal">
            <h2 style="margin-bottom:15px;">게임 게시하기</h2>
            <label style="font-size:12px; color:#94A3B8;">게임 아이콘</label>
            <select id="gameIcon">
                <option value="🎮">🎮 기본 게임</option>
                <option value="🏃">🏃 파쿠르/점프맵</option>
                <option value="⚔️">⚔️ 전투/생존</option>
                <option value="🧩">🧩 퍼즐/미로</option>
            </select>
            <input type="text" id="gameName" placeholder="게임 이름">
            <textarea id="gameDesc" placeholder="게임 설명" style="height: 80px;"></textarea>
            <label style="font-size:12px; color:#94A3B8;">VIP 패스 가격 (And)</label>
            <input type="number" id="gamePassPrice" placeholder="예: 100" value="100">
            
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                <button class="btn" style="background: #475569;" onclick="document.getElementById('publishModal').style.display='none'">취소</button>
                <button class="btn" onclick="saveAndPublish()">출시하기!</button>
            </div>
        </div>
    </div>

    <div id="toast" style="position: fixed; top: 80px; left: 50%; transform: translate(-50%, -20px); background: var(--secondary); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 9999;"></div>

    <script>
        let andCurrency = parseInt(localStorage.getItem('webblox_and')) || 0;
        let myGames = JSON.parse(localStorage.getItem('webblox_games')) || [];
        
        function updateCurrency(amount) {
            andCurrency += amount;
            localStorage.setItem('webblox_and', andCurrency);
            document.getElementById('andDisplay').innerText = andCurrency.toLocaleString();
        }
        updateCurrency(0);

        function showToast(msg, color = 'var(--secondary)') {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.style.background = color;
            toast.style.opacity = '1'; toast.style.transform = 'translate(-50%, 0)';
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translate(-50%, -20px)'; }, 2000);
        }

        function nav(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.getElementById('mobile-controls').style.display = screenId === 'player' ? 'flex' : 'none';
            if(screenId === 'hub') loadGamesToHub();
        }

        function loadGamesToHub() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            myGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div style="height: 100px; background: linear-gradient(45deg, #6C5CE7, #00CEC9); border-radius: 10px; margin-bottom: 10px; display: flex; justify-content:center; align-items:center; font-size:40px;">
                        ${game.icon || '🎮'}
                    </div>
                    <div style="font-weight:bold; font-size:18px;">${game.title}</div>
                    <div style="font-size:12px; color:#94A3B8; margin-top:5px;">@${game.creator}</div>
                `;
                card.onclick = () => playGame(game);
                grid.appendChild(card);
            });
            if(myGames.length === 0) grid.innerHTML = '<p style="color:#94A3B8;">만들어진 게임이 없습니다. 직접 만들어보세요!</p>';
        }
        loadGamesToHub();

        // --- Studio Engine (30x30 Grid) ---
        const rows = 30, cols = 30;
        let currentTool = 'player';
        let editorMap = Array(rows).fill().map(() => Array(cols).fill(0)); 

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function openStudio() {
            nav('studio');
            const canvas = document.getElementById('editorCanvas');
            canvas.innerHTML = '';
            editorMap = Array(rows).fill().map(() => Array(cols).fill(0)); 

            let isDragging = false;
            document.addEventListener('mousedown', () => isDragging = true);
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('touchstart', () => isDragging = true);
            document.addEventListener('touchend', () => isDragging = false);

            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    const draw = (e) => {
                        if(e.type !== 'mousedown' && e.type !== 'touchstart' && !isDragging) return;
                        
                        let val = 0;
                        if(currentTool==='wall') val = 1;
                        if(currentTool==='player') {
                            for(let i=0; i<rows; i++) for(let j=0; j<cols; j++) if(editorMap[i][j] === 2) { editorMap[i][j] = 0; updateCell(i,j, canvas); }
                            val = 2;
                        }
                        if(currentTool==='lava') val = 3;
                        if(currentTool==='goal') val = 4;
                        if(currentTool==='erase') val = 0; // 지우개 기능

                        editorMap[r][c] = val;
                        updateCell(r, c, canvas);
                    };

                    cell.addEventListener('mousedown', draw);
                    cell.addEventListener('mouseenter', draw);
                    // Mobile Touch Support
                    cell.addEventListener('touchstart', (e) => { e.preventDefault(); draw(e); });
                    canvas.appendChild(cell);
                }
            }
        }

        function updateCell(r, c, container) {
            const index = r * cols + c;
            const cell = container.children[index];
            cell.className = 'grid-cell'; 
            const val = container.id === 'editorCanvas' ? editorMap[r][c] : playMap[r][c];
            
            if(val === 1) cell.classList.add('obj-wall');
            if(val === 2) cell.classList.add('obj-player');
            if(val === 3) cell.classList.add('obj-lava');
            if(val === 4) cell.classList.add('obj-goal');
        }

        function showPublishModal() { document.getElementById('publishModal').style.display = 'flex'; }
        
        function saveAndPublish() {
            const passPrice = parseInt(document.getElementById('gamePassPrice').value) || 0;
            myGames.push({
                id: Date.now().toString(),
                title: document.getElementById('gameName').value || "무명 게임",
                desc: document.getElementById('gameDesc').value,
                icon: document.getElementById('gameIcon').value,
                passPrice: passPrice,
                creator: '나(You)',
                map: JSON.parse(JSON.stringify(editorMap))
            });
            localStorage.setItem('webblox_games', JSON.stringify(myGames));
            document.getElementById('publishModal').style.display = 'none';
            showToast("게임 게시 완료!");
            nav('hub');
        }

        // --- Player Engine ---
        let playMap = [], playerPos = {r:0, c:0}, isPlaying = false;

        function playGame(game) {
            nav('player');
            document.getElementById('playTitle').innerText = game.title;
            document.getElementById('playDesc').innerText = game.desc;
            
            const btn = document.getElementById('buyPassBtn');
            btn.innerText = `💎 VIP 패스 구매 (${game.passPrice} And)`;
            btn.onclick = () => {
                if(andCurrency >= game.passPrice) {
                    updateCurrency(-game.passPrice);
                    showToast("VIP 구매 완료!", "var(--gold)");
                    btn.innerText = "VIP 보유중 ✔️"; btn.disabled = true;
                } else showToast("And 화폐가 부족합니다!", "#EF4444");
            };

            playMap = JSON.parse(JSON.stringify(game.map));
            const canvas = document.getElementById('playCanvas');
            canvas.innerHTML = '';
            
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    canvas.appendChild(cell);
                    if(playMap[r][c] === 2) playerPos = {r, c};
                    updateCell(r, c, canvas);
                }
            }
            isPlaying = true;
            focusCameraOnPlayer(); // 맵 진입 시 플레이어 위치로 스크롤
        }

        // D-pad 및 키보드 통합 이동 로직
        function movePlayer(dx, dy) {
            if(!isPlaying) return;
            let nr = playerPos.r + dy, nc = playerPos.c + dx;

            if(nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                const target = playMap[nr][nc];
                if(target === 1) return; // 벽
                
                playMap[playerPos.r][playerPos.c] = 0;
                updateCell(playerPos.r, playerPos.c, document.getElementById('playCanvas'));
                
                if(target === 3) {
                    showToast("용암에 닿았습니다! 사망! 💀", "#EF4444");
                    isPlaying = false; setTimeout(() => nav('hub'), 1000); return;
                }
                if(target === 4) {
                    showToast("목표 도달! +50 And", "var(--primary)");
                    updateCurrency(50);
                    isPlaying = false; setTimeout(() => nav('hub'), 1000); return;
                }

                playerPos = {r: nr, c: nc};
                playMap[nr][nc] = 2;
                updateCell(nr, nc, document.getElementById('playCanvas'));
                focusCameraOnPlayer(); // 이동할 때마다 카메라 이동
            }
        }

        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, -1);
            if(e.key === 'ArrowDown' || e.key === 's') movePlayer(0, 1);
            if(e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
            if(e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
        });

        // 플레이어 시점 따라가기 (카메라 자동 스크롤)
        function focusCameraOnPlayer() {
            const scrollBox = document.getElementById('playScroll');
            const blockSize = 40; // var(--grid-size)
            // 플레이어의 위치 픽셀 계산하여 중앙에 오도록 스크롤 조절
            scrollBox.scrollLeft = (playerPos.c * blockSize) - (scrollBox.clientWidth / 2) + (blockSize / 2);
            scrollBox.scrollTop = (playerPos.r * blockSize) - (scrollBox.clientHeight / 2) + (blockSize / 2);
        }

        // --- Chat & Multiplayer Auto Connect ---
        let peer, myPeerId = '', connections = [];
        function toggleChat() {
            const w = document.getElementById('chat-widget');
            w.classList.toggle('minimized');
            document.getElementById('chatToggleIcon').innerText = w.classList.contains('minimized') ? '▲' : '▼';
        }

        function initPeer() {
            peer = new Peer();
            peer.on('open', id => {
                myPeerId = id;
                printChat(`내 접속 코드가 발급되었습니다. 친구를 초대하세요!`);
                
                // URL에 ?join=아이디 가 있으면 자동 연결
                const urlParams = new URLSearchParams(window.location.search);
                const targetHost = urlParams.get('join');
                if(targetHost && targetHost !== id) {
                    printChat(`초대 링크 감지됨! 방으로 자동 연결 중...`);
                    const conn = peer.connect(targetHost);
                    setupConnection(conn);
                }
            });

            peer.on('connection', conn => {
                setupConnection(conn);
                printChat('친구가 방에 입장했습니다! 👋');
            });
        }

        function setupConnection(conn) {
            connections.push(conn);
            conn.on('open', () => printChat('연결 성공! 채팅이 가능합니다.'));
            conn.on('data', data => {
                const div = document.createElement('div');
                div.innerHTML = `<span style="color:var(--secondary)">[친구]:</span> ${data}`;
                document.getElementById('chatMessages').appendChild(div);
                scrollToBottom();
            });
        }

        function sendMsg() {
            const inp = document.getElementById('chatInput');
            if(!inp.value.trim()) return;
            connections.forEach(c => c.send(inp.value));
            
            const div = document.createElement('div');
            div.innerHTML = `<span style="color:var(--gold)">[나]:</span> ${inp.value}`;
            document.getElementById('chatMessages').appendChild(div);
            scrollToBottom();
            inp.value = '';
        }

        function printChat(msg) {
            const div = document.createElement('div');
            div.style.color = '#94A3B8'; div.innerText = `[시스템] ${msg}`;
            document.getElementById('chatMessages').appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const box = document.getElementById('chatMessages');
            box.scrollTop = box.scrollHeight;
        }

        function copyInviteLink() {
            const inviteUrl = window.location.origin + window.location.pathname + `?join=${myPeerId}`;
            navigator.clipboard.writeText(inviteUrl).then(() => {
                showToast("초대 링크가 복사되었습니다! 카톡으로 공유하세요.", "var(--primary)");
            });
        }

        window.addEventListener('load', initPeer);
    </script>
</body>
