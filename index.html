<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>차세대 노코드 게임 스튜디오</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #2c2c2c; color: white; padding: 20px; }
        .panel { background-color: #3d3d3d; padding: 20px; border-radius: 10px; width: 400px; }
        h3 { border-bottom: 1px solid #555; padding-bottom: 10px; }
        button { 
            background-color: #4CAF50; color: white; border: none; 
            padding: 10px 15px; margin: 5px; border-radius: 5px; cursor: pointer;
            font-size: 14px; font-weight: bold;
        }
        button:hover { background-color: #45a049; }
        .input-group { margin-top: 15px; }
        input { padding: 5px; width: 60px; border-radius: 3px; border: none; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>블록 / 플레이어 속성 에디터</h2>
        
        <!-- 대상 선택 -->
        <div>
            <label>선택된 오브젝트: </label>
            <select id="objectSelect">
                <option value="player">기본 플레이어</option>
                <option value="custom_block">날아다니는 마법 블록</option>
            </select>
        </div>

        <!-- 스크립트 없이 버튼으로 능력 추가 -->
        <div class="input-group">
            <h3>⚡ 능력 추가 (자동 애니메이션 포함)</h3>
            <button onclick="sendToJava('addAbility', 'fly')">🕊️ 날 수 있음</button>
            <button onclick="sendToJava('addAbility', 'attack')">⚔️ 공격함</button>
            <button onclick="sendToJava('addAbility', 'health')">❤️ 체력/살아있음</button>
        </div>

        <!-- 물리 속성 직접 설정 -->
        <div class="input-group">
            <h3>🌍 물리 및 이동 속성</h3>
            <label>점프력 (중력 하강 적용): <input type="number" id="jumpPower" value="50"></label><br><br>
            <label>이동 속도: <input type="number" id="speed" value="15"></label><br><br>
            <button onclick="sendToJava('setPhysics', null)" style="background-color: #2196F3;">적용하기</button>
        </div>
    </div>

</body>
</html>
