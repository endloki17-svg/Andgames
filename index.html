<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 기기 완벽 대응 및 화면 잘림 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="description" content="NexBlock - 누구나 쉽게 만들고 함께 플레이하는 2D 샌드박스 멀티플레이어 플랫폼">
    
    <title>NexBlock | 궁극의 웹 게임 엔진</title>

    <!-- 최고급 웹 폰트 (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- 구글 머티리얼 아이콘 (초고퀄리티 아이콘용) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

    <!-- 분리될 CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">

    <!-- 🌌 1. 동적 파티클 배경 (초고퀄리티 분위기 연출용 캔버스) -->
    <canvas id="bg-canvas" class="background-canvas"></canvas>

    <!-- 🔔 2. 전역 알림 시스템 (토스트 메시지) -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 📱 3. 메인 앱 컨테이너 -->
    <div class="app-wrapper">
        
        <!-- 🎯 상단 네비게이션 바 (글래스모피즘 적용) -->
        <header class="glass-navbar fade-in-down">
            <div class="nav-left">
                <div class="brand-logo">
                    <span class="material-symbols-outlined logo-icon">view_in_ar</span>
                    <span class="logo-text">NexBlock</span>
                    <span class="badge-beta">BETA</span>
                </div>
            </div>
            
            <div class="nav-center hidden-mobile">
                <div class="search-bar">
                    <span class="material-symbols-outlined">search</span>
                    <input type="text" id="search-input" placeholder="게임, 크리에이터 검색...">
                </div>
            </div>

            <div class="nav-right">
                <!-- 화폐(AND) 디스플레이 -->
                <div class="currency-display tooltip" data-tooltip="자동 화폐 벌기 맵으로 이동" onclick="location.href='clicker.html'">
                    <span class="material-symbols-outlined icon-gold">monetization_on</span>
                    <span id="global-and-balance" class="currency-amount">0</span>
                    <span class="currency-label">AND</span>
                </div>
                <!-- 프로필 버튼 -->
                <button class="icon-btn profile-btn" onclick="openModal('profile-modal')">
                    <span class="material-symbols-outlined">account_circle</span>
                </button>
            </div>
        </header>

        <!-- 🚀 4. 메인 콘텐츠 영역 -->
        <main class="main-content">
            
            <!-- 대문(Hero) 섹션 -->
            <section class="hero-section fade-in">
                <div class="hero-content">
                    <h1 class="hero-title">상상하는 모든 것을<br><span class="text-gradient">현실로 만드세요</span></h1>
                    <p class="hero-subtitle">코딩 없이 클릭만으로 멀티플레이 게임을 만들고, 전 세계 플레이어와 함께 즐기세요.</p>
                    
                    <div class="hero-actions">
                        <!-- 에디터 페이지로 이동 -->
                        <button class="btn btn-primary btn-large" onclick="location.href='editor.html'">
                            <span class="material-symbols-outlined">add_circle</span>
                            새 월드 만들기 (무한맵)
                        </button>
                        <!-- 클리커(화폐 벌기) 페이지로 이동 -->
                        <button class="btn btn-secondary btn-large pulse-anim" onclick="location.href='clicker.html'">
                            <span class="material-symbols-outlined">diamond</span>
                            AND 화폐 벌기
                        </button>
                    </div>
                </div>
                <!-- 우측 장식용 3D/일러스트 플레이스홀더 영역 -->
                <div class="hero-graphics">
                    <div class="floating-cube cube-1"></div>
                    <div class="floating-cube cube-2"></div>
                </div>
            </section>

            <!-- 🎮 게임 리스트 섹션 -->
            <section class="games-section fade-in-up">
                <div class="section-header">
                    <h2>🔥 인기 월드 탐험하기</h2>
                    <div class="filter-group">
                        <button class="filter-btn active">전체</button>
                        <button class="filter-btn">내가 만든 게임</button>
                        <button class="filter-btn">VIP 전용</button>
                    </div>
                </div>

                <!-- 게임 카드가 렌더링될 그리드 영역 -->
                <div id="games-grid" class="games-grid">
                    <!-- JS 로드 전 뼈대(Skeleton) UI: 초고퀄 디테일 -->
                    <div class="game-card skeleton">
                        <div class="sk-icon"></div>
                        <div class="sk-title"></div>
                        <div class="sk-desc"></div>
                        <div class="sk-btn"></div>
                    </div>
                    <div class="game-card skeleton">
                        <div class="sk-icon"></div>
                        <div class="sk-title"></div>
                        <div class="sk-desc"></div>
                        <div class="sk-btn"></div>
                    </div>
                    <div class="game-card skeleton">
                        <div class="sk-icon"></div>
                        <div class="sk-title"></div>
                        <div class="sk-desc"></div>
                        <div class="sk-btn"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ⚙️ 5. 모달 다이얼로그 모음 -->
    <!-- 프로필 및 설정 모달 -->
    <dialog id="profile-modal" class="glass-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ 플레이어 설정</h3>
                <button class="icon-btn close-btn" onclick="closeModal('profile-modal')">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>플레이어 닉네임</label>
                    <input type="text" id="player-name-input" placeholder="멋진 닉네임을 입력하세요">
                </div>
                <div class="form-group">
                    <label>내 캐릭터 색상</label>
                    <input type="color" id="player-color-input" value="#00ffcc">
                </div>
                <div class="stats-box">
                    <p>내 보유 자산: <strong id="modal-and-balance">0</strong> AND</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveProfile(); closeModal('profile-modal')">저장하기</button>
            </div>
        </div>
    </dialog>

    <!-- 🧬 6. 동적 렌더링을 위한 템플릿 (초고퀄리티 개발 패턴) -->
    <!-- 이 템플릿은 브라우저에 안 보이고, JS가 복사해서 게임 목록을 만들 때 씁니다. -->
    <template id="game-card-template">
        <div class="game-card glow-on-hover">
            <div class="card-header">
                <div class="game-icon">🎮</div>
                <div class="pass-badge">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span class="pass-cost">0 AND</span>
                </div>
            </div>
            <div class="card-body">
                <h3 class="game-title">게임 제목</h3>
                <p class="game-desc">게임에 대한 재미있는 설명이 들어갑니다.</p>
                <div class="creator-info">
                    <span class="material-symbols-outlined" style="font-size: 16px;">person</span>
                    <span class="creator-name">크리에이터</span>
                </div>
            </div>
            <div class="card-footer">
                <!-- 플레이 페이지로 이동 (URL 파라미터로 ID 전달) -->
                <button class="btn btn-play full-width">
                    <span class="material-symbols-outlined">play_arrow</span> 플레이
                </button>
            </div>
        </div>
    </template>

    <!-- 분리될 JS 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
