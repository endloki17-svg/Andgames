<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CreateVerse Studio - 2D 로블록스 메이커</title>
    
    <!-- 프리텐다드 폰트 & 폰트어썸 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- 멀티플레이 라이브러리 -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="app-container">
        
        <!-- 1. 로딩 스크린 -->
        <div id="loading-screen" class="screen active">
            <div class="loader-content">
                <i class="fa-solid fa-cube fa-spin logo-icon"></i>
                <h1>Studio Engine</h1>
                <p>에셋과 물리 엔진을 불러오는 중...</p>
                <div class="progress-bar"><div class="progress-fill"></div></div>
            </div>
        </div>

        <!-- 2. 메인 로비 -->
        <div id="main-menu" class="screen hidden">
            <header class="top-nav glass-nav">
                <div class="brand">
                    <i class="fa-solid fa-layer-group text-primary"></i> 
                    <span>CreateVerse</span>
                </div>
                <div class="user-dashboard">
                    <div class="currency-badge pop">
                        <i class="fa-solid fa-coins text-gold"></i>
                        <span id="and-balance" class="balance-text">0</span>
                        <span class="currency-unit">and</span>
                    </div>
                    <button class="btn btn-primary pop" onclick="UI.showPublishModal()">
                        <i class="fa-solid fa-plus"></i> <span>스튜디오 열기</span>
                    </button>
                </div>
            </header>
            
            <main class="content-area scrollable">
                <div class="header-banner">
                    <h2>창작의 세계</h2>
                    <p>로블록스처럼 자유롭게 만들고, 친구들과 실시간으로 플레이하세요.</p>
                </div>
                <div id="game-list" class="game-grid"></div>
            </main>
        </div>

        <!-- 3. 새 게임(월드) 만들기 모달 -->
        <div id="publish-modal" class="modal-backdrop hidden">
            <div class="modal-window">
                <div class="modal-header">
                    <h2><i class="fa-solid fa-earth-asia"></i> 새 월드 설정</h2>
                    <button class="icon-btn" onclick="UI.hidePublishModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label>게임 이름</label>
                        <input type="text" id="game-name" placeholder="멋진 이름을 지어주세요">
                    </div>
                    <div class="input-group">
                        <label>게임 설명</label>
                        <textarea id="game-desc" placeholder="어떤 게임인가요?" rows="2"></textarea>
                    </div>
                    <div class="input-row">
                        <div class="input-group half">
                            <label>아이콘</label>
                            <input type="text" id="game-icon" value="🎮" class="center-text">
                        </div>
                        <div class="input-group half">
                            <label>입장 패스 (and)</label>
                            <div class="price-input">
                                <i class="fa-solid fa-coins text-gold"></i>
                                <input type="number" id="game-pass-price" value="0" min="0">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" onclick="UI.hidePublishModal()">취소</button>
                    <button class="btn btn-primary pop" onclick="GameApp.createNewGame()">
                        <i class="fa-solid fa-hammer"></i> 에디터 시작
                    </button>
                </div>
            </div>
        </div>

        <!-- 4. 게임 & 스튜디오 엔진 화면 -->
        <div id="game-screen" class="screen hidden">
            <canvas id="game-canvas"></canvas>
            
            <!-- (A) 진짜 로블록스 스튜디오 같은 편집 UI -->
            <div id="editor-ui" class="game-ui-layer hidden">
                
                <!-- 상단 컨트롤 바 -->
                <div class="studio-topbar glass-panel slide-down">
                    <div class="topbar-left">
                        <button class="btn btn-outline pop" onclick="GameApp.saveAndExit()">
                            <i class="fa-solid fa-right-from-bracket"></i> 나가기
                        </button>
                        <span class="camera-hint"><i class="fa-solid fa-arrows-up-down-left-right"></i> WASD (이동)</span>
                    </div>
                    <div class="topbar-right">
                        <button class="btn btn-success pop test-play-btn" onclick="GameApp.testPlay()">
                            <i class="fa-solid fa-play"></i> 테스트 플레이
                        </button>
                    </div>
                </div>

                <!-- 좌측 툴바 (도구 선택) -->
                <div class="studio-leftbar glass-panel slide-right">
                    <button class="tool-btn active pop" id="tool-select" onclick="Editor.setTool('select')" title="선택/이동">
                        <i class="fa-solid fa-arrow-pointer"></i><span>선택</span>
                    </button>
                    <button class="tool-btn pop" id="tool-draw" onclick="Editor.setTool('draw')" title="블록 그리기">
                        <i class="fa-solid fa-pen"></i><span>그리기</span>
                    </button>
                    <button class="tool-btn pop" id="tool-erase" onclick="Editor.setTool('erase')" title="지우개">
                        <i class="fa-solid fa-eraser"></i><span>지우기</span>
                    </button>
                </div>

                <!-- 하단 에셋 팔레트 (블록 종류) -->
                <div class="studio-bottombar glass-panel slide-up">
                    <div class="palette-scroll">
                        <button class="asset-btn active" id="asset-normal" onclick="Editor.setAsset('normal')">
                            <div class="asset-preview" style="background:#a5b4fc;"></div> 기본 블록
                        </button>
                        <button class="asset-btn" id="asset-bounce" onclick="Editor.setAsset('bounce')">
                            <div class="asset-preview" style="background:#34d399;"></div> 바운스
                        </button>
                        <button class="asset-btn" id="asset-lava" onclick="Editor.setAsset('lava')">
                            <div class="asset-preview" style="background:#f87171;"></div> 용암(데스)
                        </button>
                        <button class="asset-btn" id="asset-spawn" onclick="Editor.setAsset('spawn')">
                            <div class="asset-preview" style="border: 2px dashed #fbbf24;"></div> 스폰 포인트
                        </button>
                        <button class="asset-btn" id="asset-clicker" onclick="Editor.setAsset('clicker')">
                            <div class="asset-preview" style="background:#fbbf24; display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold; font-size:10px;">$</div> 화폐 박스
                        </button>
                    </div>
                </div>

                <!-- 우측 속성(Properties) 창 -->
                <div class="studio-rightbar glass-panel slide-left" id="properties-panel">
                    <div class="prop-header">속성 (Properties)</div>
                    <div id="no-selection-msg" class="prop-empty">블록을 선택해주세요.</div>
                    
                    <div id="prop-content" class="hidden">
                        <div class="prop-group">
                            <label>크기 (W / H)</label>
                            <div class="prop-row">
                                <input type="number" id="prop-w" onchange="Editor.updateProp('w')">
                                <input type="number" id="prop-h" onchange="Editor.updateProp('h')">
                            </div>
                        </div>
                        <div class="prop-group">
                            <label>색상 (Color)</label>
                            <input type="color" id="prop-color" onchange="Editor.updateProp('color')">
                        </div>
                        <div class="prop-group">
                            <label class="toggle-label">
                                <span>고정됨 (Anchored)</span>
                                <input type="checkbox" id="prop-anchored" onchange="Editor.updateProp('anchored')">
                            </label>
                            <span class="prop-desc">체크 해제 시 중력을 받아 떨어집니다.</span>
                        </div>
                        <div class="prop-group">
                            <label class="toggle-label">
                                <span>충돌 가능 (CanCollide)</span>
                                <input type="checkbox" id="prop-collide" onchange="Editor.updateProp('canCollide')">
                            </label>
                            <span class="prop-desc">체크 해제 시 통과할 수 있습니다.</span>
                        </div>
                        <button class="btn btn-outline text-danger pop" style="width:100%; margin-top:10px;" onclick="Editor.deleteSelected()">
                            <i class="fa-solid fa-trash"></i> 블록 삭제
                        </button>
                    </div>
                </div>
            </div>

            <!-- (B) 플레이 모드 전용 UI -->
            <div id="play-ui" class="game-ui-layer hidden">
                <button class="btn-back glass-panel pop" onclick="GameApp.exitPlay()">
                    <i class="fa-solid fa-chevron-left"></i> 나가기
                </button>
                
                <div id="chat-widget" class="chat-panel glass-panel">
                    <div id="chat-messages" class="scrollable"></div>
                    <div class="chat-input-box">
                        <input type="text" id="chat-input" placeholder="채팅 입력..." autocomplete="off">
                        <button class="chat-send-btn pop" onclick="Network.sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

                <!-- 조이스틱 및 액션 버튼 -->
                <div class="mobile-controls-layer">
                    <div class="joystick-base" id="joystick">
                        <div class="joystick-stick" id="knob"></div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-jump pop" id="jump-btn">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="particle-container"></div>
        </div>
        
        <div id="toast-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
