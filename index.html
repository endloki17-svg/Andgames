        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .tab-btn.active { color: #3b82f6; font-weight: 600; }
        .tab-btn.active::after { transform: scaleX(1); }

    <div id="toast-container" class="fixed bottom-5 right-5 z-[200] flex flex-col space-y-3 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Local State (Always starts empty)
        window.localNewsData = [];
        window.localEventsData = [];
        window.isAdmin = false;

        // UI Utilities
        window.switchTab = (tabId, btn) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        };

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-white border-green-500' : 'bg-white border-red-500';
            const icon = type === 'success' ? 'ph-check-circle text-green-500' : 'ph-warning-circle text-red-500';

            toast.className = `flex items-center w-full max-w-xs p-4 rounded-xl border shadow-xl ${bgColor} text-slate-800 animate-modal-in pointer-events-auto`;
            toast.innerHTML = `
                <i class="ph-fill ${icon} text-2xl mr-3"></i>
                <div class="text-sm font-medium">${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.openModal = (modalId) => {
            const modal = document.getElementById(modalId);
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.querySelector('.fixed.inset-0').style.opacity = '1';
                modal.querySelector('.inline-block').classList.add('animate-modal-in');
            }, 10);
        };

        window.closeModal = (modalId) => {
            const modal = document.getElementById(modalId);
            modal.classList.add('hidden');
            modal.querySelectorAll('input[type="text"], textarea').forEach(input => input.value = '');
            if(modalId === 'newsModal') resetImageDropzone('news-file', 'news-preview', 'news-dropzone-content', 'news-remove-img', 'newsImageBase64');
            if(modalId === 'eventModal') resetImageDropzone('event-file', 'event-preview', 'event-dropzone-content', 'event-remove-img', 'eventImageBase64');
        };

        const formatDate = (timestamp) => {
            const date = new Date(timestamp);
            return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
        };

        window.handleAuth = () => {
            const val = document.getElementById('nickname-input').value.trim();
            const adminPanel = document.getElementById('admin-panel');
            
            if (val === 'I am a creat') {
                if (!window.isAdmin) {
                    window.isAdmin = true;
                    adminPanel.classList.add('revealed');
                    showToast('개발자 모드가 활성화되었습니다. 등록 권한이 부여됩니다.', 'success');
                }
            } else {
                if (window.isAdmin) {
                    window.isAdmin = false;
                    adminPanel.classList.remove('revealed');
                    showToast('일반 사용자 모드로 전환되었습니다.', 'success');
                } else if (val !== '') {
                    showToast(`'${val}'님 환영합니다.`, 'success');
                }
            }
        };

        const compressImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200; const MAX_HEIGHT = 1200;
                        let width = img.width; let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        };

        window.handleFileSelect = async (event, previewId, contentId, removeBtnId, hiddenInputId) => {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) return showToast('이미지 파일만 업로드 가능합니다.', 'error');

            try {
                const base64Image = await compressImage(file);
                document.getElementById(hiddenInputId).value = base64Image;
                const previewImg = document.getElementById(previewId);
                previewImg.src = base64Image;
                previewImg.classList.remove('hidden');
                document.getElementById(contentId).classList.add('hidden');
                document.getElementById(removeBtnId).classList.remove('hidden');
            } catch (error) {
                showToast('이미지 처리 중 오류가 발생했습니다.', 'error');
            }
        };

        window.removeImage = (event, fileInputId, previewId, contentId, removeBtnId, hiddenInputId) => {
            event.stopPropagation();
            resetImageDropzone(fileInputId, previewId, contentId, removeBtnId, hiddenInputId);
        };

        const resetImageDropzone = (fileInputId, previewId, contentId, removeBtnId, hiddenInputId) => {
            document.getElementById(fileInputId).value = '';
            document.getElementById(hiddenInputId).value = '';
            document.getElementById(previewId).src = '';
            document.getElementById(previewId).classList.add('hidden');
            document.getElementById(contentId).classList.remove('hidden');
            document.getElementById(removeBtnId).classList.add('hidden');
        };

        const setupDropzone = (dropzoneId, fileInputId) => {
            const dropzone = document.getElementById(dropzoneId);
            const fileInput = document.getElementById(fileInputId);
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
                dropzone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
            });
            ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, () => dropzone.classList.add('dragover'), false));
            ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, () => dropzone.classList.remove('dragover'), false));
            dropzone.addEventListener('drop', e => {
                const dt = e.dataTransfer;
                if(dt.files && dt.files.length > 0) {
                    fileInput.files = dt.files;
                    fileInput.dispatchEvent(new Event('change'));
                }
            }, false);
        };

        setupDropzone('news-dropzone', 'news-file');
        setupDropzone('event-dropzone', 'event-file');

        const renderEmptyState = (containerId, title, message, iconClass) => {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="col-span-full py-20 flex flex-col items-center justify-center bg-white rounded-2xl border border-slate-200 border-dashed animate-fade-in">
                    <div class="bg-slate-50 p-4 rounded-full mb-4 shadow-inner">
                        <i class="ph-duotone ${iconClass} text-5xl text-slate-400"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-700 mb-1">${title}</h3>
                    <p class="text-sm text-slate-500 text-center font-light">${message}</p>
                </div>
            `;
        };

        const renderNews = (newsArray) => {
            const container = document.getElementById('news-grid');
            if (newsArray.length === 0) {
                renderEmptyState('news-grid', '등록된 뉴스가 없습니다', '새로운 소식이 올라오기를 기다려주세요.', 'ph-newspaper-clipping');
                return;
            }

            let html = '';
            newsArray.forEach((news, index) => {
                html += `
                    <article class="flex flex-col bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl hover:border-brand-200 overflow-hidden transition-all duration-300 animate-slide-up group" style="animation-delay: ${index * 0.1}s; opacity: 0;">
                        <div class="h-52 w-full relative overflow-hidden bg-slate-100">
                            <img class="h-full w-full object-cover transform transition-transform duration-700 group-hover:scale-105" src="${news.imageBase64}" alt="${news.title}">
                        </div>
                        <div class="p-6 flex-1 flex flex-col">
                            <h3 class="text-xl font-bold text-slate-800 font-serif line-clamp-2 leading-tight group-hover:text-brand-600 transition-colors mb-3">${news.title}</h3>
                            <p class="text-sm text-slate-600 line-clamp-3 leading-relaxed flex-1">${news.content}</p>
                            <div class="mt-6 flex items-center justify-between border-t border-slate-100 pt-4">
                                <div class="flex items-center space-x-2">
                                    <div class="h-6 w-6 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-[10px] font-bold">
                                        ${news.author.charAt(0).toUpperCase()}
                                    </div>
                                    <span class="text-xs font-medium text-slate-600">${news.author}</span>
                                </div>
                                <div class="text-xs text-slate-400 flex items-center">
                                    <i class="ph ph-clock mr-1"></i> ${formatDate(news.timestamp)}
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            });
            container.innerHTML = html;
        };

        const renderEvents = (eventsArray) => {
            const container = document.getElementById('events-grid');
            if (eventsArray.length === 0) {
                renderEmptyState('events-grid', '예정된 이벤트가 없습니다', '다양한 행사가 곧 준비될 예정입니다.', 'ph-calendar-blank');
                return;
            }

            let html = '';
            eventsArray.forEach((event, index) => {
                html += `
                    <div class="group relative rounded-2xl overflow-hidden aspect-[3/4] bg-slate-100 border border-slate-200 shadow-sm hover:shadow-xl transition-all duration-300 animate-slide-up" style="animation-delay: ${index * 0.1}s; opacity: 0;">
                        <img src="${event.imageBase64}" alt="${event.title}" class="absolute inset-0 w-full h-full object-cover transform transition-transform duration-700 group-hover:scale-105">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent"></div>
                        
                        <div class="absolute inset-0 p-5 flex flex-col justify-end">
                            <div class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full w-fit mb-3 border border-white/30">
                                <span class="text-[10px] font-bold text-white uppercase tracking-wider">Event</span>
                            </div>
                            <h3 class="text-xl font-bold text-white leading-tight font-serif mb-2">${event.title}</h3>
                            <div class="flex items-center justify-between mt-1 border-t border-white/20 pt-3">
                                <div class="flex items-center text-xs text-slate-200">
                                    <i class="ph ph-calendar-check mr-1"></i> ${formatDate(event.timestamp)}
                                </div>
                                <span class="text-[10px] text-slate-300">By ${event.author}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        };

        window.submitNews = async () => {
            const title = document.getElementById('news-title').value.trim();
            const imageBase64 = document.getElementById('newsImageBase64').value;
            const content = document.getElementById('news-content').value.trim();
            const author = 'CREAT Developer'; // Fixed author for Admin

            if (!title || !imageBase64 || !content) return showToast('모든 필드를 입력해주세요.', 'error');

            const newArticle = { title, imageBase64, content, author, timestamp: Date.now() };

            try {
                if (useFirebase && auth.currentUser) {
                    await addDoc(newsCollection, newArticle);
                } else {
                    window.localNewsData.unshift(newArticle);
                    renderNews(window.localNewsData);
                }
                showToast('기사가 성공적으로 발행되었습니다.');
                closeModal('newsModal');
            } catch (e) {
                window.localNewsData.unshift(newArticle);
                renderNews(window.localNewsData);
                showToast('발행 완료 (Local 저장)');
                closeModal('newsModal');
            }
        };

        window.submitEvent = async () => {
            const title = document.getElementById('event-title').value.trim();
            const imageBase64 = document.getElementById('eventImageBase64').value;
            const author = 'CREAT Developer'; // Fixed author for Admin

            if (!title || !imageBase64) return showToast('이벤트 명과 포스터를 등록해주세요.', 'error');

            const newEvent = { title, imageBase64, author, timestamp: Date.now() };

            try {
                if (useFirebase && auth.currentUser) {
                    await addDoc(eventsCollection, newEvent);
                } else {
                    window.localEventsData.unshift(newEvent);
                    renderEvents(window.localEventsData);
                }
                showToast('이벤트가 성공적으로 등록되었습니다.');
                closeModal('eventModal');
                switchTab('events-tab', document.querySelectorAll('.tab-btn')[1]); // Switch to events tab
            } catch (e) {
                window.localEventsData.unshift(newEvent);
                renderEvents(window.localEventsData);
                showToast('등록 완료 (Local 저장)');
                closeModal('eventModal');
                switchTab('events-tab', document.querySelectorAll('.tab-btn')[1]);
            }
        };

        // Initialize App State
        let useFirebase = true;
        let auth, db, newsCollection, eventsCollection;

        const init = async () => {
            // Render initial empty states
            renderNews(window.localNewsData);
            renderEvents(window.localEventsData);

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'creat-bright-premium';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "mock" };

            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                newsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'news');
                eventsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'events');
                
                await signInAnonymously(auth);
                
                onSnapshot(newsCollection, (snapshot) => {
                    window.localNewsData = [];
                    snapshot.forEach((doc) => window.localNewsData.push({ id: doc.id, ...doc.data() }));
                    window.localNewsData.sort((a, b) => b.timestamp - a.timestamp);
                    renderNews(window.localNewsData);
                });

                onSnapshot(eventsCollection, (snapshot) => {
                    window.localEventsData = [];
                    snapshot.forEach((doc) => window.localEventsData.push({ id: doc.id, ...doc.data() }));
                    window.localEventsData.sort((a, b) => b.timestamp - a.timestamp);
                    renderEvents(window.localEventsData);
                });
            } catch (e) {
                console.warn("Operating in Local State Only mode.");
                useFirebase = false;
            }
        };

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
