<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CreateVerse Studio - Pro Edition</title>
    
    <!-- 프리텐다드 폰트 & 폰트어썸 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="app-container">
        
        <!-- 1. 로딩 스크린 -->
        <div id="loading-screen" class="screen active">
            <div class="loader-content">
                <i class="fa-solid fa-cube fa-spin logo-icon"></i>
                <h1>Studio <span class="text-primary">Pro</span></h1>
                <p>워크스페이스와 물리 엔진을 초기화하는 중...</p>
                <div class="progress-bar"><div class="progress-fill"></div></div>
            </div>
        </div>

        <!-- 2. 메인 로비 -->
        <div id="main-menu" class="screen hidden">
            <header class="top-nav">
                <div class="brand">
                    <i class="fa-solid fa-laptop-code text-primary"></i> 
                    <span>CreateVerse</span>
                </div>
                <div class="user-dashboard">
                    <div class="currency-badge pop">
                        <i class="fa-solid fa-coins text-gold"></i>
                        <span id="and-balance" class="balance-text">0</span>
                        <span class="currency-unit">and</span>
                    </div>
                    <button class="btn btn-primary pop" onclick="UI.showPublishModal()">
                        <i class="fa-solid fa-plus"></i> <span>새 프로젝트</span>
                    </button>
                </div>
            </header>
            
            <main class="content-area scrollable">
                <div class="header-banner">
                    <h2>내 프로젝트</h2>
                    <p>로블록스 스튜디오처럼 정교한 2D 샌드박스를 구축하세요.</p>
                </div>
                <div id="game-list" class="game-grid"></div>
            </main>
        </div>

        <!-- 3. 새 프로젝트 모달 -->
        <div id="publish-modal" class="modal-backdrop hidden">
            <div class="modal-window">
                <div class="modal-header">
                    <h2><i class="fa-solid fa-folder-plus"></i> 새 월드 생성</h2>
                    <button class="icon-btn" onclick="UI.hidePublishModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label>프로젝트 명</label>
                        <input type="text" id="game-name" placeholder="예: 무한의 계단 점프맵">
                    </div>
                    <div class="input-group">
                        <label>프로젝트 설명</label>
                        <textarea id="game-desc" placeholder="어떤 규칙의 게임인가요?" rows="2"></textarea>
                    </div>
                    <div class="input-row">
                        <div class="input-group half">
                            <label>아이콘 설정</label>
                            <input type="text" id="game-icon" value="🧩" class="center-text">
                        </div>
                        <div class="input-group half">
                            <label>입장 패스 (and)</label>
                            <div class="price-input">
                                <i class="fa-solid fa-coins text-gold"></i>
                                <input type="number" id="game-pass-price" value="0" min="0">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" onclick="UI.hidePublishModal()">취소</button>
                    <button class="btn btn-primary pop" onclick="GameApp.createNewGame()">
                        <i class="fa-solid fa-hammer"></i> 워크스페이스 열기
                    </button>
                </div>
            </div>
        </div>

        <!-- 4. [핵심] 분리형 스튜디오 워크스페이스 -->
        <!-- UI와 캔버스가 겹치지 않도록 구역을 완벽히 분할했습니다. -->
        <div id="editor-ui" class="screen editor-layout hidden">
            
            <!-- 상단 메뉴바 (File, Play 등) -->
            <header class="studio-header">
                <div class="header-left">
                    <div class="studio-logo"><i class="fa-solid fa-cube"></i> Studio</div>
                    <button class="menu-btn" onclick="GameApp.saveAndExit()"><i class="fa-solid fa-folder-open"></i> 저장 및 나가기</button>
                </div>
                <div class="header-center">
                    <span class="camera-hint"><i class="fa-solid fa-arrows-up-down-left-right"></i> WASD 키로 화면 이동</span>
                </div>
                <div class="header-right">
                    <button class="btn btn-success pop test-play-btn" onclick="GameApp.testPlay()">
                        <i class="fa-solid fa-play"></i> 테스트 플레이
                    </button>
                </div>
            </header>

            <div class="studio-body">
                <!-- 좌측: 도구 모음 (툴바) -->
                <aside class="panel-left">
                    <div class="panel-title">Tools</div>
                    <div class="tool-grid">
                        <button class="tool-btn active" id="tool-select" onclick="Editor.setTool('select')">
                            <i class="fa-solid fa-arrow-pointer"></i><span>선택</span>
                        </button>
                        <button class="tool-btn" id="tool-draw" onclick="Editor.setTool('draw')">
                            <i class="fa-solid fa-pen-ruler"></i><span>생성</span>
                        </button>
                        <button class="tool-btn" id="tool-erase" onclick="Editor.setTool('erase')">
                            <i class="fa-solid fa-eraser"></i><span>삭제</span>
                        </button>
                    </div>
                </aside>

                <!-- 중앙: 독립된 캔버스 뷰포트 -->
                <!-- 이 영역 안에서만 클릭 이벤트가 발생하므로 버그가 완벽 차단됩니다. -->
                <main class="panel-center" id="viewport-container">
                    <div class="viewport-tab">
                        <i class="fa-solid fa-gamepad"></i> Viewport
                        <span id="canvas-coords">X: 0, Y: 0</span>
                    </div>
                    <!-- 캔버스 영역 -->
                    <canvas id="game-canvas"></canvas>
                </main>

                <!-- 우측: 정밀 속성창 (Properties) -->
                <aside class="panel-right" id="properties-panel">
                    <div class="panel-title">Properties</div>
                    
                    <div id="no-selection-msg" class="prop-empty">
                        <i class="fa-solid fa-cube"></i>
                        <p>블록을 선택하여<br>속성을 편집하세요.</p>
                    </div>
                    
                    <div id="prop-content" class="prop-form hidden scrollable">
                        <!-- 기본 속성 -->
                        <div class="prop-category">Data</div>
                        <div class="prop-group">
                            <label>ID</label>
                            <input type="text" id="prop-id" readonly disabled>
                        </div>
                        <div class="prop-group">
                            <label>Type (기능)</label>
                            <select id="prop-type" onchange="Editor.updateProp('type')">
                                <option value="normal">일반 블록 (Normal)</option>
                                <option value="bounce">바운스 (Bounce)</option>
                                <option value="lava">용암 (Lava/Damage)</option>
                                <option value="clicker">화폐 상자 (Clicker)</option>
                                <option value="spawn">스폰 포인트 (Spawn)</option>
                            </select>
                        </div>

                        <!-- 크기 및 위치 -->
                        <div class="prop-category">Transform</div>
                        <div class="prop-group">
                            <label>크기 (Size W / H)</label>
                            <div class="prop-row">
                                <input type="number" id="prop-w" onchange="Editor.updateProp('w')">
                                <input type="number" id="prop-h" onchange="Editor.updateProp('h')">
                            </div>
                        </div>

                        <!-- 외형 디자인 -->
                        <div class="prop-category">Appearance</div>
                        <div class="prop-group">
                            <label>색상 (Color)</label>
                            <div class="color-picker-wrap">
                                <input type="color" id="prop-color" onchange="Editor.updateProp('color')">
                                <span id="prop-color-hex">#ffffff</span>
                            </div>
                        </div>

                        <!-- 물리 엔진 -->
                        <div class="prop-category">Physics</div>
                        <div class="prop-group toggle-group">
                            <label>고정됨 (Anchored)</label>
                            <label class="switch">
                                <input type="checkbox" id="prop-anchored" onchange="Editor.updateProp('anchored')">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="prop-desc">체크 해제 시 중력을 받아 떨어집니다.</div>
                        
                        <div class="prop-group toggle-group">
                            <label>충돌 (CanCollide)</label>
                            <label class="switch">
                                <input type="checkbox" id="prop-collide" onchange="Editor.updateProp('canCollide')">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="prop-desc">체크 해제 시 통과할 수 있습니다.</div>

                        <button class="btn btn-danger block-btn" onclick="Editor.deleteSelected()">
                            <i class="fa-solid fa-trash"></i> 블록 삭제 (Delete)
                        </button>
                    </div>
                </aside>
            </div>
        </div>

        <!-- 5. 플레이 모드 UI (기존과 동일하게 유지하되 퀄리티 업) -->
        <div id="play-ui" class="screen play-layout hidden">
            <!-- 캔버스는 엔진에서 위치를 이동시켜 재사용합니다 -->
            <button class="btn-back pop" onclick="GameApp.exitPlay()">
                <i class="fa-solid fa-right-from-bracket"></i> 스튜디오로 복귀
            </button>
            
            <div id="chat-widget" class="chat-panel">
                <div id="chat-messages" class="scrollable"></div>
                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="채팅 입력..." autocomplete="off">
                    <button class="chat-send-btn pop" onclick="Network.sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <div class="mobile-controls-layer">
                <div class="joystick-base" id="joystick">
                    <div class="joystick-stick" id="knob"></div>
                </div>
                <div class="action-buttons">
                    <button class="btn-jump pop" id="jump-btn">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <div id="particle-container"></div>
        <div id="toast-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
