<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CreateVerse - Ultimate Sandbox</title>
    
    <!-- 폰트 및 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- 멀티플레이 네트워킹 -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="app-wrapper">
        
        <!-- ==========================================
             1. 로딩 스크린
        =========================================== -->
        <div id="screen-loading" class="app-screen active">
            <div class="loader-content">
                <i class="fa-solid fa-cube fa-bounce logo-icon"></i>
                <h1>CreateVerse</h1>
                <p>세계를 불러오는 중...</p>
                <div class="progress-bar"><div class="progress-fill"></div></div>
            </div>
        </div>

        <!-- ==========================================
             2. 메인 로비 (날아갔던 로비 완벽 복구)
        =========================================== -->
        <div id="screen-lobby" class="app-screen hidden">
            <!-- 상단 네비게이션 -->
            <header class="lobby-header glass-panel">
                <div class="brand-logo">
                    <i class="fa-solid fa-cube text-primary"></i> CreateVerse
                </div>
                <div class="user-stats">
                    <div class="currency-badge pop">
                        <i class="fa-solid fa-coins text-gold"></i>
                        <span id="and-balance">0</span> <span class="unit">and</span>
                    </div>
                    <button class="btn btn-primary pop" onclick="UI.showPublishModal()">
                        <i class="fa-solid fa-plus"></i> 새 게임 만들기
                    </button>
                </div>
            </header>
            
            <!-- 게임 리스트 영역 -->
            <main class="lobby-content scrollable">
                <div class="banner">
                    <h2>플레이 가능한 세계들</h2>
                    <p>화폐(and)를 모아 패스를 구매하고, 다른 유저의 맵을 탐험하세요.</p>
                </div>
                <div id="game-list" class="game-grid">
                    <!-- 스크립트로 게임 카드들이 렌더링 됩니다 -->
                </div>
            </main>
        </div>

        <!-- ==========================================
             3. 게임 생성 모달 (패스 설정)
        =========================================== -->
        <div id="modal-publish" class="modal-overlay hidden">
            <div class="modal-box slide-up">
                <div class="modal-header">
                    <h2><i class="fa-solid fa-hammer"></i> 새로운 게임 창조</h2>
                    <button class="btn-close" onclick="UI.hidePublishModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>게임 이름</label>
                        <input type="text" id="game-name" placeholder="예: 무한의 화폐 클릭커">
                    </div>
                    <div class="form-group">
                        <label>게임 설명</label>
                        <textarea id="game-desc" rows="2" placeholder="어떤 규칙의 게임인가요?"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label>대표 아이콘</label>
                            <input type="text" id="game-icon" value="🎮" class="text-center" maxlength="2">
                        </div>
                        <div class="form-group flex-2">
                            <label>입장 패스 (and)</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-coins text-gold"></i>
                                <input type="number" id="game-pass-price" value="0" min="0">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" onclick="UI.hidePublishModal()">취소</button>
                    <button class="btn btn-primary pop" onclick="GameApp.createNewGame()">
                        스튜디오 열기 <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ==========================================
             4. 직관적인 스튜디오 에디터 (복잡한 메뉴 제거)
        =========================================== -->
        <div id="screen-studio" class="app-screen hidden">
            
            <!-- 스튜디오 상단 컨트롤 바 -->
            <header class="studio-topbar">
                <div class="left-controls">
                    <button class="btn btn-outline pop" onclick="GameApp.saveAndExit()">
                        <i class="fa-solid fa-house"></i> 저장 후 로비로
                    </button>
                </div>
                <div class="center-controls">
                    <span class="hint"><i class="fa-solid fa-arrows-up-down-left-right"></i> WASD 또는 화면 드래그로 이동</span>
                </div>
                <div class="right-controls">
                    <button class="btn btn-success pop" onclick="GameApp.testPlay()">
                        <i class="fa-solid fa-play"></i> 테스트 플레이
                    </button>
                </div>
            </header>

            <!-- 에디터 워크스페이스 -->
            <div class="studio-workspace">
                
                <!-- 좌측 툴 & 에셋 (터치하기 쉽게 큼직하게 변경) -->
                <aside class="panel-left">
                    <div class="panel-title">Tools & Blocks</div>
                    <div class="tool-section">
                        <button class="tool-btn active pop" id="tool-draw" onclick="Editor.setTool('draw')">
                            <i class="fa-solid fa-pen"></i><span>그리기</span>
                        </button>
                        <button class="tool-btn pop" id="tool-erase" onclick="Editor.setTool('erase')">
                            <i class="fa-solid fa-eraser"></i><span>지우개</span>
                        </button>
                        <button class="tool-btn pop" id="tool-select" onclick="Editor.setTool('select')">
                            <i class="fa-solid fa-hand-pointer"></i><span>선택</span>
                        </button>
                    </div>
                    <div class="divider"></div>
                    <div class="asset-list scrollable">
                        <div class="asset-item active pop" id="asset-normal" onclick="Editor.setAsset('normal')">
                            <div class="asset-color" style="background:#5c6bc0;"></div> 기본 파트
                        </div>
                        <div class="asset-item pop" id="asset-bounce" onclick="Editor.setAsset('bounce')">
                            <div class="asset-color" style="background:#4caf50;"></div> 바운스 패드
                        </div>
                        <div class="asset-item pop" id="asset-lava" onclick="Editor.setAsset('lava')">
                            <div class="asset-color" style="background:#ef5350;"></div> 용암(데스)
                        </div>
                        <div class="asset-item pop" id="asset-clicker" onclick="Editor.setAsset('clicker')">
                            <div class="asset-color" style="background:#ffb300; display:flex; align-items:center; justify-content:center; font-weight:bold; color:black;">$</div> 화폐 박스
                        </div>
                        <div class="asset-item pop" id="asset-spawn" onclick="Editor.setAsset('spawn')">
                            <div class="asset-color" style="border: 2px dashed #ffb300;"></div> 스폰 위치
                        </div>
                    </div>
                </aside>

                <!-- 중앙 캔버스 영역 -->
                <main class="panel-center" id="viewport-container">
                    <canvas id="game-canvas"></canvas>
                </main>

                <!-- 우측 속성(Properties) 창 -->
                <aside class="panel-right">
                    <div class="panel-title">Properties</div>
                    
                    <div id="prop-empty" class="empty-state">
                        <i class="fa-solid fa-cube"></i><br>선택 도구로 블록을<br>클릭하여 편집하세요.
                    </div>

                    <div id="prop-content" class="prop-form hidden scrollable">
                        <!-- 블록 크기 조절 (드래그 대신 숫자로 직관적 조절) -->
                        <div class="prop-group">
                            <label>크기 조절 (Size)</label>
                            <div class="flex-row">
                                <div class="input-box"><span>가로</span><input type="number" id="prop-w" onchange="Editor.updateProp('w')"></div>
                                <div class="input-box"><span>세로</span><input type="number" id="prop-h" onchange="Editor.updateProp('h')"></div>
                            </div>
                        </div>

                        <!-- 색상 -->
                        <div class="prop-group">
                            <label>색상 (Color)</label>
                            <input type="color" id="prop-color" onchange="Editor.updateProp('color')" class="color-picker">
                        </div>

                        <!-- 물리 속성 (간단한 토글) -->
                        <div class="prop-group">
                            <label>물리 효과 (Physics)</label>
                            <label class="toggle-row">
                                <span>고정됨 (Anchored)</span>
                                <input type="checkbox" id="prop-anchored" onchange="Editor.updateProp('anchored')">
                                <div class="toggle-switch"></div>
                            </label>
                            <label class="toggle-row">
                                <span>충돌함 (CanCollide)</span>
                                <input type="checkbox" id="prop-collide" onchange="Editor.updateProp('canCollide')">
                                <div class="toggle-switch"></div>
                            </label>
                        </div>
                    </div>
                </aside>
            </div>
        </div>

        <!-- ==========================================
             5. 플레이 화면 (스크린샷 버그 해결: 독립된 화면으로 분리)
        =========================================== -->
        <div id="screen-play" class="app-screen hidden">
            <!-- 플레이 화면 전용 캔버스 컨테이너 -->
            <div id="play-viewport-container"></div>
            
            <!-- 플레이 전용 인게임 UI -->
            <div class="play-ui-layer">
                <button class="btn-exit-play pop" onclick="GameApp.exitPlay()">
                    <i class="fa-solid fa-door-open"></i> 나가기
                </button>
                
                <div class="leaderboard-panel glass-panel">
                    <div class="lb-title">Players</div>
                    <ul id="player-list"></ul>
                </div>

                <div class="chat-panel glass-panel">
                    <div id="chat-messages" class="scrollable"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="채팅을 입력하세요...">
                        <button onclick="Network.sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

                <!-- 모바일 조이스틱 -->
                <div class="mobile-hud">
                    <div class="joy-base" id="joystick"><div class="joy-knob" id="knob"></div></div>
                    <button class="jump-btn pop" id="jump-btn">JUMP</button>
                </div>
            </div>
        </div>

        <!-- 시스템 파티클 & 알림 -->
        <div id="particle-container"></div>
        <div id="toast-container"></div>

    </div>
    <script src="script.js"></script>
</body>
</html>
